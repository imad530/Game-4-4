        function doc(db, collectionName, docId) {

          return ref.onSnapshot(function (snap) {
            callback({

                return snap.exists;
              },
              data: function () {
                return snap.data();
              },
            });
          });

function analyzeSelection(selected, board, lang) {
  const t = T[lang];
  if (!board || selected.length === 0) {
    return { valid: false, reason: t.err_selectAtLeastOne };
  }
  for (const i of selected) {
    if (board[i]) return { valid: false, reason: t.err_occupied };
  }
  const rows = new Set(selected.map(row));
  const cols = new Set(selected.map(col));

  if (rows.size > 1 && cols.size > 1) {
    return { valid: false, reason: t.err_sameLine };
  }

  if (rows.size === 1) {
    const sorted = [...selected].sort((a, b) => col(a) - col(b));
    for (let k = 1; k < sorted.length; k++) {
      const gap = col(sorted[k]) - col(sorted[k - 1]);
      if (gap !== 1) return { valid: false, reason: t.err_adjacent };
    }
  } else {
    const sorted = [...selected].sort((a, b) => row(a) - row(b));
    for (let k = 1; k < sorted.length; k++) {
      const gap = row(sorted[k]) - row(sorted[k - 1]);
      if (gap !== 1) return { valid: false, reason: t.err_adjacent };
    }
  }

  return { valid: true, reason: "" };
}

// Game 1: chosen starter. Game 2: the other player. Decider (game 3): chosen starter again.
function starterFor(gameIndex, initialStarter) {
  const other = initialStarter === 1 ? 2 : 1;
  if (gameIndex === 2) return other;
  return initialStarter;
}

function genCode() {
  let s = "";
  for (let i = 0; i < 4; i++) s += CODE_CHARS[Math.floor(Math.random() * CODE_CHARS.length)];
  return s;
}

  try {

    return snap.exists() ? snap.data() : null;
  } catch (e) {

}

function AuthScreen({ t, onSessionReady }) {
  const [screen, setScreen] = useState("choice"); // choice | create | login | guest
  const [username, setUsername] = useState("");
  const [password, setPassword] = useState("");
  const [displayName, setDisplayName] = useState("");
  const [guestName, setGuestName] = useState("");
  const [error, setError] = useState("");
  const [busy, setBusy] = useState(false);

  function resetFields() {
    setUsername("");
    setPassword("");
    setDisplayName("");
    setGuestName("");
    setError("");
  }

  function goTo(next) {
    resetFields();
    setScreen(next);
  }

  async function handleCreateAccount() {
    if (!username.trim() || !password.trim() || !displayName.trim()) {
      setError(t.authFillAll);
      return;
    }
    setBusy(true);
    const accountId = username.trim().toLowerCase();
    let existing = null;
    try {
      const snap = await getDoc(doc(db, "accounts", accountId));
      existing = snap.exists() ? snap.data() : null;
    } catch (e) {
      setError(t.authGenericError);
      setBusy(false);
      return;
    }
    if (existing) {
      setError(t.authUsernameTaken);
      setBusy(false);
      return;
    }
    try {
      await setDoc(doc(db, "accounts", accountId), {
        username: username.trim(),
        password,
        displayName: displayName.trim(),
      });
      localStorage.setItem(
        "logged-in-account",
        JSON.stringify({ username: username.trim(), displayName: displayName.trim() })
      );
    } catch (e) {
      setError(t.authGenericError);
      setBusy(false);
      return;
    }
    setBusy(false);
    onSessionReady({ type: "account", name: displayName.trim(), username: username.trim() });
  }

  async function handleLogin() {
    if (!username.trim() || !password.trim()) {
      setError(t.authFillAll);
      return;
    }
    setBusy(true);
    const accountId = username.trim().toLowerCase();
    let account = null;
    try {
      const snap = await getDoc(doc(db, "accounts", accountId));
      account = snap.exists() ? snap.data() : null;
    } catch (e) {
      account = null;
    }
    if (!account) {
      setError(t.authAccountNotFound);
      setBusy(false);
      return;
    }
    if (account.password !== password) {
      setError(t.authWrongPassword);
      setBusy(false);
      return;
    }
    try {
      localStorage.setItem(
        "logged-in-account",
        JSON.stringify({ username: account.username, displayName: account.displayName })
      );
    } catch (e) {
      // ignore persistence failure, session still works for this visit
    }
    setBusy(false);
    onSessionReady({ type: "account", name: account.displayName, username: account.username });
  }

  function handleGuest() {
    if (!guestName.trim()) {
      setError(t.authEnterName);
      return;
    }
    onSessionReady({ type: "guest", name: guestName.trim() });
  }

  if (screen === "choice") {
    return (
      <div style={styles.card}>
        <p style={styles.introText}>{t.authIntro}</p>
        <div style={styles.row}>
          <button style={{ ...styles.bigBtn, ...styles.p1Btn }} onClick={() => goTo("create")}>
            {t.authCreateAccount}
          </button>
          <button style={{ ...styles.bigBtn, ...styles.p2Btn }} onClick={() => goTo("login")}>
            {t.authLogin}
          </button>
        </div>
        <div style={styles.row}>
          <button style={{ ...styles.bigBtn, ...styles.neutralBtn }} onClick={() => goTo("guest")}>
            {t.authGuest}
          </button>
        </div>
      </div>
    );
  }

  if (screen === "create") {
    return (
      <div style={styles.card}>
        <div style={styles.nameField}>
          <label style={styles.nameLabel(styles.p1Btn.background)}>{t.authDisplayName}</label>
          <input
            style={styles.nameInput}
            type="text"
            maxLength={16}
            value={displayName}
            onChange={(e) => setDisplayName(e.target.value)}
          />
        </div>
        <div style={styles.nameField}>
          <label style={styles.nameLabel(styles.p1Btn.background)}>{t.authUsername}</label>
          <input
            style={styles.nameInput}
            type="text"
            maxLength={20}
            value={username}
            onChange={(e) => setUsername(e.target.value)}
          />
        </div>
        <div style={styles.nameField}>
          <label style={styles.nameLabel(styles.p1Btn.background)}>{t.authPassword}</label>
          <input
            style={styles.nameInput}
            type="password"
            maxLength={40}
            value={password}
            onChange={(e) => setPassword(e.target.value)}
          />
        </div>
        <div style={styles.smallNote}>{t.authNote}</div>
        {error && <div style={styles.errorText}>{error}</div>}
        <button
          style={{ ...styles.bigBtn, ...styles.p1Btn, width: "100%", marginTop: 10, opacity: busy ? 0.6 : 1 }}
          onClick={handleCreateAccount}
          disabled={busy}
        >
          {t.authSubmitCreate}
        </button>
        <button style={styles.linkBtn} onClick={() => goTo("choice")}>
          {t.authBackToChoice}
        </button>
      </div>
    );
  }

  if (screen === "login") {
    return (
      <div style={styles.card}>
        <div style={styles.nameField}>
          <label style={styles.nameLabel(styles.p1Btn.background)}>{t.authUsername}</label>
          <input
            style={styles.nameInput}
            type="text"
            maxLength={20}
            value={username}
            onChange={(e) => setUsername(e.target.value)}
          />
        </div>
        <div style={styles.nameField}>
          <label style={styles.nameLabel(styles.p1Btn.background)}>{t.authPassword}</label>
          <input
            style={styles.nameInput}
            type="password"
            maxLength={40}
            value={password}
            onChange={(e) => setPassword(e.target.value)}
          />
        </div>
        {error && <div style={styles.errorText}>{error}</div>}
        <button
          style={{ ...styles.bigBtn, ...styles.p2Btn, width: "100%", marginTop: 10, opacity: busy ? 0.6 : 1 }}
          onClick={handleLogin}
          disabled={busy}
        >
          {t.authSubmitLogin}
        </button>
        <button style={styles.linkBtn} onClick={() => goTo("choice")}>
          {t.authBackToChoice}
        </button>
      </div>
    );
  }

  // screen === "guest"
  return (
    <div style={styles.card}>
      <div style={styles.nameField}>
        <label style={styles.nameLabel(styles.p1Btn.background)}>{t.authGuestNameLabel}</label>
        <input
          style={styles.nameInput}
          type="text"
          maxLength={16}
          value={guestName}
          onChange={(e) => setGuestName(e.target.value)}

      </div>
      {error && <div style={styles.errorText}>{error}</div>}
      <button
        style={{ ...styles.bigBtn, ...styles.neutralBtn, marginTop: 10 }}
        onClick={handleGuest}

      </button>
      <button style={styles.linkBtn} onClick={() => goTo("choice")}>
        {t.authBackToChoice}
      </button>
    </div>
  );
}

// ---------------------------------------------------------------------------
// LOCAL (pass-and-play) MODE
// ---------------------------------------------------------------------------
function LocalGame({ onBack, lang, session }) {
  const t = T[lang];
  const [stage, setStage] = useState("setup"); // setup | playing | roundOver
  const [names, setNames] = useState({ 1: session && session.name ? session.name : "", 2: "" });
  const [initialStarter, setInitialStarter] = useState(1);
  const [gameIndex, setGameIndex] = useState(1);
  const [matchScore, setMatchScore] = useState({ 1: 0, 2: 0 });
  const [speed, setSpeed] = useState("blitz");
  const [timeLeft, setTimeLeft] = useState(SPEED_SECONDS.blitz);

  const [board, setBoard] = useState(Array(TOTAL).fill(null));
  const [current, setCurrent] = useState(1);
  const [selected, setSelected] = useState([]);
  const [roundLoser, setRoundLoser] = useState(null);
  const [lastMove, setLastMove] = useState([]);

  const [wins, setWins] = useState({ 1: 0, 2: 0, draws: 0 });

  const info = useMemo(() => analyzeSelection(selected, board, lang), [selected, board, lang]);
  const filledCount = board.filter(Boolean).length;

  const nameOf = (p) => (names[p] && names[p].trim() ? names[p].trim() : p === 1 ? t.defaultPlayer1 : t.defaultPlayer2);

  useEffect(() => {
    try {
      const raw = localStorage.getItem("wins-score");
      if (raw) {
        const parsed = JSON.parse(raw);
        setWins({ 1: parsed[1] || 0, 2: parsed[2] || 0, draws: parsed.draws || 0 });
      }
    } catch (e) {
      // no saved score yet
    }
  }, []);

  function saveWins(next) {
    setWins(next);
    try {
      localStorage.setItem("wins-score", JSON.stringify(next));
    } catch (e) {
      // ignore
    }
  }

  async function resetScores() {
    await saveWins({ 1: 0, 2: 0, draws: 0 });
  }

  useEffect(() => {
    if (stage !== "playing") return;
    if (timeLeft <= 0) {
      const firstEmpty = board.findIndex((c) => !c);
      if (firstEmpty !== -1) applyMove([firstEmpty]);
      return;
    }
    const t = setTimeout(() => setTimeLeft((v) => v - 1), 1000);
    return () => clearTimeout(t);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [stage, timeLeft]);

  function beginBoard(starter) {
    setBoard(Array(TOTAL).fill(null));
    setCurrent(starter);
    setSelected([]);
    setRoundLoser(null);
    setLastMove([]);
    setTimeLeft(SPEED_SECONDS[speed]);
    setStage("playing");
  }

  function startMatch(starter) {
    setInitialStarter(starter);
    setGameIndex(1);
    setMatchScore({ 1: 0, 2: 0 });
    beginBoard(starter);
  }

  function toggleCell(i) {
    if (board[i]) return;
    setSelected((prev) => (prev.includes(i) ? prev.filter((x) => x !== i) : [...prev, i]));
  }

  function applyMove(cells) {
    const next = [...board];
    cells.forEach((i) => (next[i] = current));
    setBoard(next);
    setLastMove(cells);
    setSelected([]);

    const stillEmpty = next.some((c) => !c);
    if (!stillEmpty) {
      setRoundLoser(current);
      const roundWinner = current === 1 ? 2 : 1;
      const newMatchScore = { ...matchScore, [roundWinner]: matchScore[roundWinner] + 1 };
      setMatchScore(newMatchScore);

      const decided = gameIndex === 2;
      if (decided) {
        if (newMatchScore[1] !== newMatchScore[2]) {
          const matchWinner = newMatchScore[1] > newMatchScore[2] ? 1 : 2;
          saveWins({ ...wins, [matchWinner]: (wins[matchWinner] || 0) + 1 });
        } else {
          saveWins({ ...wins, draws: (wins.draws || 0) + 1 });
        }
      }
      setStage("roundOver");
    } else {
      setCurrent((c) => (c === 1 ? 2 : 1));
      setTimeLeft(SPEED_SECONDS[speed]);
    }
  }

  function confirmMove() {
    if (!info.valid) return;
    applyMove(selected);
  }

  function clearSelection() {
    setSelected([]);
  }

  function nextRound() {
    const nextIndex = gameIndex + 1;
    setGameIndex(nextIndex);
    beginBoard(starterFor(nextIndex, initialStarter));
  }

  const matchDecided = stage === "roundOver" && gameIndex === 2;
  const isDraw = matchDecided && matchScore[1] === matchScore[2];
  const matchWinner = matchDecided && !isDraw ? (matchScore[1] > matchScore[2] ? 1 : 2) : null;

  return (
    <>
      {stage === "setup" && (
        <div style={styles.card}>
          <p style={styles.introText}>{t.localIntro}</p>

          {(wins[1] > 0 || wins[2] > 0) && (
            <ScoreBoard names={{ 1: nameOf(1), 2: nameOf(2) }} score={wins} />
          )}

          <div style={styles.nameField}>
            <label style={styles.nameLabel(styles.p1Btn.background)}>{t.player1NameLabel}</label>
            <input
              style={styles.nameInput}
              type="text"
              maxLength={16}
              placeholder={t.player1Placeholder}
              value={names[1]}
              onChange={(e) => setNames((n) => ({ ...n, 1: e.target.value }))}
            />
          </div>

          <div style={styles.nameField}>
            <label style={styles.nameLabel(styles.p2Btn.background)}>{t.player2NameLabel}</label>
            <input
              style={styles.nameInput}
              type="text"
              maxLength={16}
              placeholder={t.player2Placeholder}
              value={names[2]}
              onChange={(e) => setNames((n) => ({ ...n, 2: e.target.value }))}
            />
          </div>

          <div style={styles.introText}>{t.gameSpeedLabel}</div>
          <SpeedPicker speed={speed} onPick={setSpeed} t={t} />

          <div style={styles.introText}>{t.whoStartsLabel}</div>
          <div style={styles.row}>
            <button style={{ ...styles.bigBtn, ...styles.p1Btn }} onClick={() => startMatch(1)}>
              {nameOf(1)}
            </button>
            <button style={{ ...styles.bigBtn, ...styles.p2Btn }} onClick={() => startMatch(2)}>
              {nameOf(2)}
            </button>
          </div>

          <div style={styles.row}>
            {(wins[1] > 0 || wins[2] > 0) && (
              <button style={styles.linkBtn} onClick={resetScores}>
                {t.resetScores}
              </button>
            )}
            <button style={styles.linkBtn} onClick={onBack}>
              {t.back}
            </button>
          </div>
        </div>
      )}

      {(stage === "playing" || stage === "roundOver") && (
        <>
          <div style={styles.matchBar}>
            <span style={styles.matchLabel}>{t.roundLabel[gameIndex]}</span>
            <span style={styles.matchScoreText}>
              {matchScore[1]} - {matchScore[2]}
            </span>
          </div>

          <div style={styles.statusBar}>
            <div style={styles.turnPill(stage === "roundOver" ? null : current)}>
              {stage === "roundOver" ? t.roundOverLabel : t.turnOf(nameOf(current))}
            </div>
            {stage === "playing" && (
              <div style={styles.timerPill(timeLeft, SPEED_SECONDS[speed])}>{timeLeft}</div>
            )}
            <div style={styles.counter}>
              {filledCount} / {TOTAL}
            </div>
          </div>

          <Board
            board={board}
            selected={selected}
            lastMove={lastMove}
            interactive={stage === "playing"}
            onCellClick={toggleCell}
          />

          {stage === "playing" && (
            <div style={styles.controls}>
              <div style={styles.feedback(info.valid, selected.length)}>
                {selected.length === 0
                  ? t.chooseCellsHint
                  : info.valid
                  ? t.readyToPlace(selected.length)
                  : info.reason}
              </div>
              <div style={styles.row}>
                <button
                  style={{ ...styles.actionBtn, ...(info.valid ? styles.confirmActive : styles.confirmDisabled) }}
                  onClick={confirmMove}
                  disabled={!info.valid}
                >
                  {t.confirmMove}
                </button>
                <button
                  style={{ ...styles.actionBtn, ...styles.ghostBtn }}
                  onClick={clearSelection}
                  disabled={selected.length === 0}
                >
                  {t.clearSelection}
                </button>
              </div>
            </div>
          )}

          {stage === "roundOver" && (
            <div style={styles.card}>
              <div style={styles.resultTitle}>{t.lastMarkBy(nameOf(roundLoser))}</div>
              <div style={styles.resultSub}>{t.roundWonBy(nameOf(roundLoser === 1 ? 2 : 1))}</div>

              <ScoreBoard names={{ 1: nameOf(1), 2: nameOf(2) }} score={matchScore} />

              {!matchDecided && (
                <button style={{ ...styles.bigBtn, ...styles.neutralBtn }} onClick={nextRound}>
                  {t.secondRound}
                </button>
              )}

              {matchDecided && (
                <>
                  <div style={styles.matchWinnerBanner}>
                    {isDraw ? t.drawMatch : t.winsMatch(nameOf(matchWinner))}
                  </div>
                  <ScoreBoard names={{ 1: nameOf(1), 2: nameOf(2) }} score={wins} />
                  {wins.draws > 0 && (
                    <div style={styles.smallNote}>
                      {t.drawsLabel}: {wins.draws}
                    </div>
                  )}
                  <button style={{ ...styles.bigBtn, ...styles.neutralBtn }} onClick={() => setStage("setup")}>
                    {t.newMatch}
                  </button>
                </>
              )}
            </div>
          )}
        </>
      )}
    </>
  );
}

// ---------------------------------------------------------------------------
// ONLINE (room-based) MODE
// ---------------------------------------------------------------------------
function OnlineGame({ onBack, lang, session }) {
  const t = T[lang];
  const [myName, setMyName] = useState(session && session.name ? session.name : "");
  const [joinCodeInput, setJoinCodeInput] = useState("");
  const [roomCode, setRoomCode] = useState("");
  const [mySlot, setMySlot] = useState(null);
  const [room, setRoom] = useState(null);
  const [busy, setBusy] = useState(false);
  const [error, setError] = useState("");
  const [copied, setCopied] = useState(false);
  const [selected, setSelected] = useState([]);
  const [nowTick, setNowTick] = useState(Date.now());

  // live-listen to the shared room state
  useEffect(() => {
    if (!roomCode) return;
    const unsubscribe = onSnapshot(doc(db, "rooms", roomCode), (snap) => {
      if (snap.exists()) setRoom(snap.data());
    });
    return () => unsubscribe();
  }, [roomCode]);

  // tick for the countdown display
  useEffect(() => {
    if (!roomCode) return;
    const id = setInterval(() => setNowTick(Date.now()), 1000);
    return () => clearInterval(id);
  }, [roomCode]);

  const remaining =
    room && room.turnDeadline ? Math.max(0, Math.ceil((room.turnDeadline - nowTick) / 1000)) : null;

  // only the player on turn triggers the timeout auto-move, to avoid double writes
  useEffect(() => {
    if (!room || room.stage !== "playing" || !mySlot) return;
    if (room.current !== mySlot) return;
    if (remaining === null || remaining > 0) return;
    const firstEmpty = room.board.findIndex((c) => !c);
    if (firstEmpty !== -1) onlineApplyMove([firstEmpty]);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [remaining]);

  const onlineInfo = useMemo(
    () => analyzeSelection(selected, room ? room.board : null, lang),
    [selected, room, lang]
  );

  async function createRoom() {
    if (!myName.trim()) return setError(t.errWriteNameFirst);
    setBusy(true);
    const code = genCode();
    const r = emptyRoom();
    r.players[1] = myName.trim();
    await writeRoom(code, r);
    setRoom(r);
    setMySlot(1);
    setRoomCode(code);
    setError("");
    setBusy(false);
  }

  async function joinRoom() {
    const code = joinCodeInput.trim().toUpperCase();
    if (!code) return setError(t.errWriteRoomCode);
    if (!myName.trim()) return setError(t.errWriteNameFirst);
    setBusy(true);
    const r = await readRoom(code);
    if (!r) {
      setError(t.errRoomNotFound);
      setBusy(false);
      return;
    }
    if (r.players[2] && r.players[2].trim()) {
      setError(t.errRoomFull);
      setBusy(false);
      return;
    }
    r.players[2] = myName.trim();
    await writeRoom(code, r);
    setRoom(r);
    setMySlot(2);
    setRoomCode(code);
    setError("");
    setBusy(false);
  }

  function nameOf(p) {
    const n = room && room.players[p];
    return n && n.trim() ? n.trim() : p === 1 ? t.defaultPlayer1 : t.defaultPlayer2;
  }

  async function setOnlineSpeed(key) {
    if (!room) return;
    const updated = { ...room, speed: key };
    setRoom(updated);
    await writeRoom(roomCode, updated);
  }

  async function startOnlineMatch(starter) {
    if (!room) return;
    const updated = {
      ...room,
      initialStarter: starter,
      gameIndex: 1,
      matchScore: { 1: 0, 2: 0 },
      board: Array(TOTAL).fill(null),
      current: starter,
      roundLoser: null,
      lastMove: [],
      turnDeadline: Date.now() + SPEED_SECONDS[room.speed] * 1000,
      stage: "playing",
    };
    setRoom(updated);
    await writeRoom(roomCode, updated);
  }

  async function onlineApplyMove(cells) {
    if (!room) return;
    const next = [...room.board];
    cells.forEach((i) => (next[i] = room.current));
    const stillEmpty = next.some((c) => !c);
    let updated = { ...room, board: next, lastMove: cells };

    if (!stillEmpty) {
      const roundWinner = room.current === 1 ? 2 : 1;
      const newMatchScore = { ...room.matchScore, [roundWinner]: room.matchScore[roundWinner] + 1 };
      const decided = room.gameIndex === 2;
      updated = { ...updated, matchScore: newMatchScore, roundLoser: room.current, stage: "roundOver", turnDeadline: null };
      if (decided) {
        if (newMatchScore[1] !== newMatchScore[2]) {
          const matchWinner = newMatchScore[1] > newMatchScore[2] ? 1 : 2;
          updated.wins = { ...room.wins, [matchWinner]: (room.wins[matchWinner] || 0) + 1 };
        } else {
          updated.wins = { ...room.wins, draws: (room.wins.draws || 0) + 1 };
        }
      }
    } else {
      const nextCurrent = room.current === 1 ? 2 : 1;
      updated = { ...updated, current: nextCurrent, turnDeadline: Date.now() + SPEED_SECONDS[room.speed] * 1000 };
    }

    setRoom(updated);
    setSelected([]);
    await writeRoom(roomCode, updated);
  }

  async function confirmOnlineMove() {
    if (!onlineInfo.valid) return;
    await onlineApplyMove(selected);
  }

  async function nextOnlineRound() {
    if (!room) return;
    const nextIndex = room.gameIndex + 1;
    const starter = starterFor(nextIndex, room.initialStarter);
    const updated = {
      ...room,
      gameIndex: nextIndex,
      board: Array(TOTAL).fill(null),
      current: starter,
      roundLoser: null,
      lastMove: [],
      turnDeadline: Date.now() + SPEED_SECONDS[room.speed] * 1000,
      stage: "playing",
    };
    setRoom(updated);
    await writeRoom(roomCode, updated);
  }

  async function newOnlineMatch() {
    if (!room) return;
    const updated = {
      ...room,
      stage: "lobby",
      board: Array(TOTAL).fill(null),
      matchScore: { 1: 0, 2: 0 },
      gameIndex: 1,
      roundLoser: null,
      lastMove: [],
      turnDeadline: null,
    };
    setRoom(updated);
    await writeRoom(roomCode, updated);
  }

  function leaveRoom() {
    setRoomCode("");
    setMySlot(null);
    setRoom(null);
    setSelected([]);
    setError("");
    setCopied(false);
  }

  function toggleCell(i) {
    if (!room || room.board[i]) return;
    if (room.current !== mySlot || room.stage !== "playing") return;
    setSelected((prev) => (prev.includes(i) ? prev.filter((x) => x !== i) : [...prev, i]));
  }

  async function copyInvite() {
    const text = t.inviteText(roomCode);
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        await navigator.clipboard.writeText(text);
        setCopied(true);
        setTimeout(() => setCopied(false), 2000);
      }
    } catch (e) {
      // clipboard unavailable — the code is already visible to copy by hand
    }
  }

  const bothPresent = !!(room && room.players[1] && room.players[2] && room.players[1].trim() && room.players[2].trim());
  const matchDecided = room && room.stage === "roundOver" && room.gameIndex === 2;
  const isDraw = matchDecided && room.matchScore[1] === room.matchScore[2];

  return (
    <>
      {/* Enter name (prefilled from session), then create or join a room */}
      {!roomCode && (
        <div style={styles.card}>
          <p style={styles.introText}>{t.onlineIntro}</p>
          <div style={styles.nameField}>
            <label style={styles.nameLabel(styles.p1Btn.background)}>{t.yourNameLabel}</label>
            <input
              style={styles.nameInput}
              type="text"
              maxLength={16}
              placeholder={t.yourNamePlaceholder}
              value={myName}
              onChange={(e) => setMyName(e.target.value)}
            />
          </div>

          {error && <div style={styles.errorText}>{error}</div>}

          <button
            style={{ ...styles.bigBtn, ...styles.p1Btn, opacity: busy ? 0.6 : 1 }}
            onClick={createRoom}
            disabled={busy}
          >
            {t.createRoomBtn}
          </button>

          <div style={styles.row}>
            <input
              style={styles.nameInput}
              type="text"
              maxLength={4}
              placeholder={t.roomCodePlaceholder}
              value={joinCodeInput}
              onChange={(e) => setJoinCodeInput(e.target.value.toUpperCase())}
            />
            <button
              style={{ ...styles.bigBtn, ...styles.p2Btn, opacity: busy ? 0.6 : 1 }}
              onClick={joinRoom}
              disabled={busy}
            >
              {t.joinWithCode}
            </button>
          </div>

          <button style={styles.linkBtn} onClick={onBack}>
            {t.back}
          </button>
        </div>
      )}

      {/* Room lobby: waiting for the friend, then pick speed + starter */}
      {roomCode && room && room.stage === "lobby" && (
        <div style={styles.card}>
          <div style={styles.roomCodeBox}>
            <span style={styles.introText}>{t.roomCodeShareLabel}</span>
            <span style={styles.roomCodeText}>{roomCode}</span>
            <button style={styles.copyBtn} onClick={copyInvite}>
              {copied ? t.copiedLabel : t.copyInviteBtn}
            </button>
          </div>

          <div style={styles.waitingNote}>
            {bothPresent ? t.bothInRoom(nameOf(1), nameOf(2)) : t.waitingFriend}
          </div>

          <div style={styles.introText}>{t.gameSpeedLabel}</div>
          <SpeedPicker speed={room.speed} onPick={setOnlineSpeed} t={t} />

          {bothPresent && (
            <>
              <div style={styles.introText}>{t.whoStartsLabel}</div>
              <div style={styles.row}>
                <button style={{ ...styles.bigBtn, ...styles.p1Btn }} onClick={() => startOnlineMatch(1)}>
                  {nameOf(1)}
                </button>
                <button style={{ ...styles.bigBtn, ...styles.p2Btn }} onClick={() => startOnlineMatch(2)}>
                  {nameOf(2)}
                </button>
              </div>
            </>
          )}

          <button style={styles.linkBtn} onClick={leaveRoom}>
            {t.leaveRoomBtn}
          </button>
        </div>
      )}

      {/* Active round + round result */}
      {roomCode && room && (room.stage === "playing" || room.stage === "roundOver") && (
        <>
          <div style={styles.matchBar}>
            <span style={styles.matchLabel}>{t.roundLabel[room.gameIndex]}</span>
            <span style={styles.matchScoreText}>
              {room.matchScore[1]} - {room.matchScore[2]}
            </span>
          </div>

          <div style={styles.statusBar}>
            <div style={styles.turnPill(room.stage === "roundOver" ? null : room.current)}>
              {room.stage === "roundOver"
                ? t.roundOverLabel
                : room.current === mySlot
                ? t.yourTurnLabel
                : t.turnOf(nameOf(room.current))}
            </div>
            {room.stage === "playing" && remaining !== null && (
              <div style={styles.timerPill(remaining, SPEED_SECONDS[room.speed])}>{remaining}</div>
            )}
            <div style={styles.counter}>
              {room.board.filter(Boolean).length} / {TOTAL}
            </div>
          </div>

          <Board
            board={room.board}
            selected={selected}
            lastMove={room.lastMove}
            interactive={room.stage === "playing" && room.current === mySlot}
            onCellClick={toggleCell}
          />

          {room.stage === "playing" && (
            <div style={styles.controls}>
              <div style={styles.feedback(onlineInfo.valid, selected.length)}>
                {room.current !== mySlot
                  ? t.waitingMove(nameOf(room.current))
                  : selected.length === 0
                  ? t.chooseCellsHint
                  : onlineInfo.valid
                  ? t.readyToPlace(selected.length)
                  : onlineInfo.reason}
              </div>
              {room.current === mySlot && (
                <div style={styles.row}>
                  <button
                    style={{ ...styles.actionBtn, ...(onlineInfo.valid ? styles.confirmActive : styles.confirmDisabled) }}
                    onClick={confirmOnlineMove}
                    disabled={!onlineInfo.valid}
                  >
                    {t.confirmMove}
                  </button>
                  <button
                    style={{ ...styles.actionBtn, ...styles.ghostBtn }}
                    onClick={() => setSelected([])}
                    disabled={selected.length === 0}
                  >
                    {t.clearSelection}
                  </button>
                </div>
              )}
            </div>
          )}

          {room.stage === "roundOver" && (
            <div style={styles.card}>
              <div style={styles.resultTitle}>{t.lastMarkBy(nameOf(room.roundLoser))}</div>
              <div style={styles.resultSub}>{t.roundWonBy(nameOf(room.roundLoser === 1 ? 2 : 1))}</div>

              <ScoreBoard names={{ 1: nameOf(1), 2: nameOf(2) }} score={room.matchScore} />

              {!matchDecided && (
                <button style={{ ...styles.bigBtn, ...styles.neutralBtn }} onClick={nextOnlineRound}>
                  {t.secondRound}
                </button>
              )}

              {matchDecided && (
                <>
                  <div style={styles.matchWinnerBanner}>
                    {isDraw
                      ? t.drawMatch
                      : t.winsMatch(nameOf(room.matchScore[1] > room.matchScore[2] ? 1 : 2))}
                  </div>
                  {room.wins && <ScoreBoard names={{ 1: nameOf(1), 2: nameOf(2) }} score={room.wins} />}
                  {room.wins && room.wins.draws > 0 && (
                    <div style={styles.smallNote}>
                      {t.drawsLabel}: {room.wins.draws}
                    </div>
                  )}
                  <button style={{ ...styles.bigBtn, ...styles.neutralBtn }} onClick={newOnlineMatch}>
                    {t.newMatch}
                  </button>
                </>
              )}

              <button style={styles.linkBtn} onClick={leaveRoom}>
                {t.leaveRoomBtn}
              </button>
            </div>
          )}
        </>
      )}
    </>
  );
}

// ---------------------------------------------------------------------------
// SHARED PRESENTATIONAL COMPONENTS
// ---------------------------------------------------------------------------
function Board({ board, selected, lastMove, interactive, onCellClick }) {
  return (
    <div style={styles.grid}>
      {board.map((val, i) => {
        const isSelected = selected.includes(i);
        const isLast = lastMove.includes(i);
        const filled = !!val;
        return (
          <div
            key={i}
            className={`cell${filled ? " filled" : ""}`}
            style={styles.cellStyle(val, isSelected, isLast, interactive)}
            onClick={() => interactive && !filled && onCellClick(i)}
            role="button"
            tabIndex={interactive && !filled ? 0 : -1}
            onKeyDown={(e) => {
              if (interactive && !filled && (e.key === "Enter" || e.key === " ")) {
                e.preventDefault();
                onCellClick(i);
              }
            }}
          >
            {val === 1 ? "●" : val === 2 ? "■" : ""}
          </div>
        );
      })}
    </div>
  );
}

function ScoreBoard({ names, score }) {
  return (
    <div style={styles.scoreBoard}>
      <div style={styles.scoreItem(styles.p1Btn.background)}>
        <span>{names[1]}</span>
        <strong>{score[1]}</strong>
      </div>
      <div style={styles.scoreItem(styles.p2Btn.background)}>
        <span>{names[2]}</span>
        <strong>{score[2]}</strong>
      </div>
    </div>
  );
}

function SpeedPicker({ speed, onPick, t }) {
  return (
    <div style={styles.speedRow}>
      {Object.keys(SPEED_SECONDS).map((key) => (
        <button key={key} style={styles.speedBtn(speed === key)} onClick={() => onPick(key)}>
          {t.speedLabel[key]} · {SPEED_SECONDS[key]}{t.secondsSuffix}
        </button>
      ))}
    </div>
  );
}
